# HAProxy: smart proxy + cache + load balancer + traffic filter
#
#   clients ──▶ :8080 (frontend "web") ──▶ backend "app" (DW nodes, added at runtime)
#   stats page   http://127.0.0.1:8404/
#   Runtime API  127.0.0.1:9999  (used by the registrar to add/remove nodes)
#
# The load-balancing algorithm comes from the LB_ALGO environment variable:
#   random(2) = P2C (default) | roundrobin | leastconn | source
#   e.g.  LB_ALGO=leastconn haproxy -f config/haproxy.cfg

global
    log stdout format raw local0 info
    maxconn 4096
    stats socket ipv4@127.0.0.1:9999 level admin
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 2s
    timeout client 30s
    timeout server 15s
    timeout http-request 5s
    timeout queue 10s
    # retry on another server only when the connection itself failed
    # (safe: the request never reached the app, so even POST is not duplicated)
    retries 2
    option redispatch

# ---- response cache ("micro-cache"): GET answers are reused for 5 seconds ----
cache micro
    total-max-size 64          # MB of memory
    max-object-size 1048576    # bytes
    max-age 5                  # seconds -> data seen through the proxy is at most 5 s old

frontend web
    bind :8080

    # ---- traffic filtering ----
    # per-client-IP counters (request rate over 10 s, open connections)
    stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }      # rate limit
    http-request deny deny_status 429 if { sc_conn_cur(0) gt 20 }            # connection limit
    http-request deny deny_status 403 if { path_beg /sync /info /docs /openapi.json }  # internal endpoints
    http-request deny deny_status 403 if { req.hdr(user-agent) -m sub -i sqlmap nikto masscan }
    http-request deny deny_status 405 unless { method GET HEAD POST PUT DELETE }
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 65536 }

    http-request set-var(txn.reqid) uuid()
    http-request set-header X-Request-ID %[var(txn.reqid)]
    http-response set-header X-Request-ID %[var(txn.reqid)]
    http-response set-header X-Cache-Status HIT if { res.cache_hit }
    http-response set-header X-Cache-Status MISS if !{ res.cache_hit }

    default_backend app

backend app
    balance "${LB_ALGO-random(2)}"   # random(2) = Power of Two Choices (P2C)
    hash-type consistent       # used by "source": adding a node moves only ~1/N of clients
    option forwardfor
    option httpchk GET /health
    http-check expect status 200

    # cache only JSON GETs of /movies; XML requests and "Cache-Control: no-cache" bypass it
    http-request cache-use micro if { method GET } { path_beg /movies } !{ req.hdr(accept) -m sub xml } !{ url_param(format) -m str xml } !{ req.hdr(cache-control) -m sub no-cache }
    http-response cache-store micro if { res.hdr(content-type) -m sub json }

    # No servers are listed here: the registrar adds them at runtime
    # ("add server app/<node> ..." through the Runtime API).

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 3s
    stats show-legends
    stats admin if LOCALHOST     # lets you put a node in maintenance from the stats page
