<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e6eb;
          --accent:#2457d6; --danger:#c62828; --ok:#1b7f3b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px;
           display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header a { margin-left:auto; color:var(--accent); text-decoration:none; font-size:14px; }
  main { max-width:1100px; margin:20px auto; padding:0 16px; display:grid;
         grid-template-columns: 1fr 320px; gap:20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  td.actions { white-space:nowrap; text-align:right; }
  button { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--ink);
           border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:#b9c0cb; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .toolbar { justify-content:space-between; margin-bottom:10px; }
  .muted { color:var(--muted); font-size:13px; }
  #info { font:12px/1.5 ui-monospace, Consolas, monospace; background:#f0f2f5; border-radius:6px;
          padding:8px 10px; margin-top:12px; white-space:pre-wrap; word-break:break-all; }
  #info.err { background:#fdecec; color:var(--danger); }
  pre#raw { font:12px/1.45 ui-monospace, Consolas, monospace; background:#0f1522; color:#dbe4ff;
            padding:12px; border-radius:6px; max-height:260px; overflow:auto; white-space:pre-wrap; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#eef2ff; color:#3b4a8c; }
  .empty { color:var(--muted); text-align:center; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>Movies</h1>
  <span class="muted">All requests go through the smart proxy; it picks a server for each one.</span>
  <a href="/_proxy" target="_blank">Load-balancer dashboard →</a>
</header>

<main>
  <section class="card">
    <div class="row toolbar">
      <h2 style="margin:0">Catalogue</h2>
      <div class="row">
        <button id="prev">‹ Prev</button>
        <span id="page" class="muted"></span>
        <button id="next">Next ›</button>
        <button id="reload">Reload</button>
        <button id="xmlList">View list as XML</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Title</th><th>Year</th><th>Genre</th><th>Actors</th><th>Rating</th><th>Ver.</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="info">No request yet.</div>
    <pre id="raw" hidden></pre>
  </section>

  <aside class="card">
    <h2 id="formTitle">Add a movie</h2>
    <form id="form">
      <label for="title">Title</label><input id="title" required maxlength="200">
      <label for="year">Year</label><input id="year" type="number" min="1870" max="2100">
      <label for="genre">Genre</label><input id="genre">
      <label for="actors">Actors (comma separated)</label><input id="actors">
      <label for="rating">Rating (0-10)</label><input id="rating" type="number" step="0.1" min="0" max="10">
      <p class="muted" id="versionNote"></p>
      <div class="row">
        <button class="primary" type="submit" id="save">Add</button>
        <button type="button" id="cancel" hidden>Cancel edit</button>
      </div>
    </form>
  </aside>
</main>

<script>
const PAGE = 10;
let offset = 0, total = 0, editing = null;   // editing = {id, version}
const $ = id => document.getElementById(id);

// One place that talks to the proxy and shows which server answered.
async function call(method, url, body, headers = {}) {
  const t0 = performance.now();
  const opts = { method, headers: { Accept: "application/json", ...headers } };
  if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  let res;
  try { res = await fetch(url, opts); }
  catch (e) { showInfo(`${method} ${url}\nnetwork error: proxy not reachable`, true); throw e; }
  const ms = Math.round(performance.now() - t0);
  const text = await res.text();
  const h = name => res.headers.get(name) || "-";
  showInfo(`${method} ${url}  →  ${res.status}  (${ms} ms)\n` +
           `server: ${h("x-node")}   cache: ${h("x-cache-status")}   request id: ${h("x-request-id")}`,
           res.status >= 400);
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  return { res, data };
}

function showInfo(text, isError) { $("info").textContent = text; $("info").className = isError ? "err" : ""; }

function esc(v) { return String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function rowHtml(m) {
  return `<tr>
    <td>${esc(m.title)}</td><td>${esc(m.year)}</td><td>${esc(m.genre)}</td>
    <td>${esc((m.actors || []).join(", "))}</td><td>${esc(m.rating)}</td>
    <td><span class="tag" title="last changed on ${esc(m.node)}">v${m.version}</span></td>
    <td class="actions">
      <button data-act="edit" data-id="${m.id}">Edit</button>
      <button data-act="xml" data-id="${m.id}">XML</button>
      <button data-act="del" data-id="${m.id}" class="danger">Delete</button>
    </td></tr>`;
}

async function loadList() {
  const { res, data } = await call("GET", `/movies?offset=${offset}&limit=${PAGE}`);
  if (!res.ok) return;
  total = data.total;
  $("rows").innerHTML = data.items.length ? data.items.map(rowHtml).join("")
                                          : `<tr><td colspan="7" class="empty">No movies yet. Add one on the right.</td></tr>`;
  const last = Math.min(offset + PAGE, total);
  $("page").textContent = total ? `${offset + 1}–${last} of ${total}` : "0";
  $("prev").disabled = offset === 0;
  $("next").disabled = last >= total;
}

function formBody() {
  const num = v => v === "" ? null : Number(v);
  return { title: $("title").value.trim(), year: num($("year").value), genre: $("genre").value.trim() || null,
           actors: $("actors").value.split(",").map(s => s.trim()).filter(Boolean), rating: num($("rating").value) };
}

function resetForm() {
  editing = null;
  $("form").reset();
  $("formTitle").textContent = "Add a movie";
  $("save").textContent = "Add";
  $("cancel").hidden = true;
  $("versionNote").textContent = "";
}

async function startEdit(id) {
  const { res, data } = await call("GET", `/movies/${id}`, undefined, { "Cache-Control": "no-cache" });
  if (!res.ok) return;
  editing = { id, version: data.version };
  $("title").value = data.title; $("year").value = data.year ?? ""; $("genre").value = data.genre ?? "";
  $("actors").value = (data.actors || []).join(", "); $("rating").value = data.rating ?? "";
  $("formTitle").textContent = "Edit movie";
  $("save").textContent = "Save";
  $("cancel").hidden = false;
  $("versionNote").textContent = `Editing version ${data.version}. If someone else saves first, you get a conflict instead of overwriting their change.`;
}

async function save(ev) {
  ev.preventDefault();
  const body = formBody();
  const { res, data } = editing
    ? await call("PUT", `/movies/${editing.id}`, body, { "If-Match": `"${editing.version}"` })
    : await call("POST", "/movies", body);
  if (res.status === 409) {
    alert(`Someone changed this movie meanwhile (now version ${data.current_version}). Reloading it — re-apply your edit.`);
    return startEdit(editing.id);
  }
  if (res.ok) { resetForm(); loadList(); }
}

async function remove(id) {
  if (!confirm("Delete this movie?")) return;
  const { res } = await call("DELETE", `/movies/${id}`);
  if (res.ok) loadList();
}

async function showXml(url) {
  const { data } = await call("GET", url, undefined, { Accept: "application/xml" });
  $("raw").hidden = false;
  $("raw").textContent = typeof data === "string" ? data.replace(/></g, ">\n<") : JSON.stringify(data, null, 2);
}

$("rows").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === "edit") startEdit(id);
  if (b.dataset.act === "del") remove(id);
  if (b.dataset.act === "xml") showXml(`/movies/${id}`);
});
$("form").addEventListener("submit", save);
$("cancel").addEventListener("click", resetForm);
$("reload").addEventListener("click", loadList);
$("prev").addEventListener("click", () => { offset = Math.max(0, offset - PAGE); loadList(); });
$("next").addEventListener("click", () => { offset += PAGE; loadList(); });
$("xmlList").addEventListener("click", () => showXml(`/movies?offset=${offset}&limit=${PAGE}`));
loadList();
</script>
</body>
</html>
